<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ccr / ccc — Claude Code Resume, with Codex">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f30"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee0a0"/>
      <stop offset="1" stop-color="#5fd7af"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd7d7"/>
      <stop offset="1" stop-color="#5fafff"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- terminal window -->
  <rect x="24" y="24" width="1152" height="372" rx="18" fill="url(#bg)" stroke="#2c2c40" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="60"  cy="62" r="8" fill="#ff5f56"/>
  <circle cx="88"  cy="62" r="8" fill="#ffbd2e"/>
  <circle cx="116" cy="62" r="8" fill="#27c93f"/>
  <text x="600" y="67" text-anchor="middle" class="mono" font-size="18" fill="#5b5b70">~/.claude + ~/.codex — ccr · ccc</text>
  <line x1="24" y1="88" x2="1176" y2="88" stroke="#2c2c40" stroke-width="1.5"/>

  <!-- wordmark: ccr (Claude Code) / ccc (Claude Code + Codex) -->
  <text x="64" y="196" class="mono" font-size="104" font-weight="700">
    <tspan fill="#5fd7af">❯</tspan><tspan fill="url(#word)" dx="16">ccr</tspan><tspan fill="#4a4a60" dx="22">/</tspan><tspan fill="url(#codex)" dx="22">ccc</tspan><tspan fill="#5fd7d7" dx="6">▋</tspan>
  </text>

  <!-- "with Codex" badge next to the wordmark -->
  <rect x="842" y="128" width="286" height="64" rx="32" fill="#1b2a33" stroke="#5fd7d7" stroke-width="2"/>
  <text x="985" y="170" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#5fd7d7">+ Codex</text>

  <!-- subtitle + tagline -->
  <text x="70" y="246" class="mono" font-size="28" font-weight="600" fill="#dadada" xml:space="preserve">Claude Code Resume<tspan fill="#585858">  ·  </tspan><tspan fill="#5fd7d7">ccc</tspan><tspan fill="#9aa0b4"> = Claude Code + Codex</tspan></text>
  <text x="70" y="280" class="mono" font-size="19" fill="#9aa0b4">Claude Code &amp; Codex sessions · Desktop · ports left running · resume anywhere</text>

  <!-- sample rows (echo the real ccc UI palette) -->
  <text x="70" y="324" class="mono" font-size="20" xml:space="preserve"><tspan fill="#d7875f">claude </tspan><tspan fill="#585858">│ </tspan><tspan fill="#5fd787"> just now </tspan><tspan fill="#585858">│ </tspan><tspan fill="#d7af87">⚙ </tspan><tspan fill="#dadada">Add JWT auth to the API gateway </tspan><tspan fill="#585858">│ </tspan><tspan fill="#87afd7">~/code/acme-api</tspan></text>
  <text x="70" y="352" class="mono" font-size="20" xml:space="preserve"><tspan fill="#5fd7d7">codex  </tspan><tspan fill="#585858">│ </tspan><tspan fill="#5fd787">   9m ago </tspan><tspan fill="#585858">│ </tspan><tspan fill="#dadada">  Fix the rate limiter            </tspan><tspan fill="#585858">│ </tspan><tspan fill="#5fd7d7">~/code/acme-api</tspan></text>
  <text x="70" y="380" class="mono" font-size="20" xml:space="preserve"><tspan fill="#d7af87">⚙ </tspan><tspan fill="#ffff5f" font-weight="700">:5173  </tspan><tspan fill="#ffffff" font-weight="700">vite   </tspan><tspan fill="#5fd7d7">~/code/acme-api  </tspan><tspan fill="#87ff87" text-decoration="underline">→ http://localhost:5173</tspan></text>
</svg>
